name: digest

on:
  schedule:
    # 09:00 MSK = 06:00 UTC (morning)
    - cron: "0 6 * * *"
    # 21:00 MSK = 18:00 UTC (evening)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run"
        required: true
        default: "morning"
        type: choice
        options: [morning, evening]

permissions:
  contents: write

concurrency:
  group: digest-${{ github.event.schedule || github.event.inputs.slot }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      GROK_MODEL_PRIMARY: grok-4.3
      GROK_MODEL_FALLBACK: grok-4.20-non-reasoning
      GROK_REASONING_EFFORT: medium

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          else
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Run digest
        run: python -m src.main ${{ steps.slot.outputs.slot }}

      - name: Commit state & telemetry
        if: always()
        run: |
          git config user.name "grock-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json telemetry.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: ${{ steps.slot.outputs.slot }} $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
