name: digest

on:
  schedule:
    # 02:00 UTC = 05:00 MSK
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      GROK_MODEL_PRIMARY: grok-4.3
      GROK_MODEL_FALLBACK: grok-4.20-non-reasoning
      GROK_REASONING_EFFORT: medium
      GROK_MAX_OUTPUT: "3000"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run digest
        run: python -m src.main morning

      - name: Commit state & telemetry
        if: always()
        run: |
          git config user.name "grock-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json telemetry.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
